[package]
name = "vectorme"
version = "0.1.0"
description = "Vectorme – raster to clean SVG on Linux"
authors = ["Vectorme"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "vectorme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
vectorme-core = { path = "../crates/vectorme-core" }
